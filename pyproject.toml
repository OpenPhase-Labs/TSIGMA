[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsigma"
version = "1.0.0"
description = "Traffic Signal Intelligence: Gathering Metrics & Analytics"
readme = "README.md"
requires-python = ">=3.13"
license = "MPL-2.0"
authors = [
    { name = "OpenPhase Labs" },
]

dependencies = [
    # Web framework
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "starlette==1.6.0",   # covers GHSA-x746-7m8f-x49c, GHSA-wqp7-x3pw-xc5r, PYSEC-2026-161
    "jinja2==3.1.6",
    "python-multipart==0.0.32",

    # Database
    "sqlalchemy[asyncio]==2.0.51",
    "asyncpg==0.31.0",
    "alembic==1.19.1",

    # Data processing
    "pandas==3.0.5",

    # Configuration
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",

    # Authentication
    "bcrypt==5.0.0",

    # Session store / cache
    "valkey==6.1.1",

    # GraphQL
    "strawberry-graphql[fastapi]==0.324.0",   # covers CVE-2026-45739 GraphiQL header leak

    # HTTP clients
    "httpx==0.28.1",
    "aiohttp==3.14.3",

    # XML security
    "defusedxml==0.7.1",

    # Credential encryption
    "cryptography==50.0.0",

    # Real-time streaming
    "nats-py==2.15.0",
    "aiomqtt==2.5.1",
    "grpcio==1.83.0",

    # Protobuf decoding (OpenPhase protocol)
    "protobuf==7.35.1",

    # Scheduling
    "apscheduler==3.11.3",

    # File watching
    "watchdog==6.0.0",

    # Cold-tier query
    "duckdb==1.5.5",

    # Security floor for a transitive dep (pulled in by httpx, requests, etc.)
    "idna==3.18",   # covers CVE-2026-45409 idna.encode() DoS
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.16.2",
    "grpcio-tools==1.83.0",
    "moto[s3,server]==5.2.2",
    "pysnmp==7.1.28",
    "aiobotocore==3.9.0",
]
# Multi-dialect integration-test extras.  Each dialect's integration
# tests prefer a dev-provided DB URL (TSIGMA_TEST_{PG,MSSQL,ORACLE,MYSQL}_URL)
# and fall back to spinning up a Docker container via testcontainers
# if the URL is unset and Docker is available.  Tests skip gracefully
# when neither path is usable.
integration = [
    "testcontainers[postgres,mssql,oracle,mysql]==4.15.0",
    "aioodbc==0.5.0",
    "oracledb==4.0.2",
    "aiomysql==0.3.2",
]
mssql = ["aioodbc==0.5.0"]
oracle = ["oracledb==4.0.2"]
mysql = ["aiomysql==0.3.2"]
s3 = ["aiobotocore==3.9.0"]
snmp = ["pysnmp==7.1.28"]

[project.scripts]
tsigma = "tsigma.main:main"

[tool.hatch.build.targets.wheel]
packages = ["tsigma"]

[tool.ruff]
target-version = "py313"
line-length = 120
# Generated protobuf code — do not lint.
extend-exclude = ["tsigma/collection/decoders/proto/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# Blank-line rules (E302/E303/E305) are in ruff preview — enable just those.
preview = true
explicit-preview-rules = true
# RUF100 = unused noqa (catches stale suppressions whose underlying warning
#         no longer fires — i.e., the suppression has outlived its reason).
#         Combined with the pre-commit hook in `.pre-commit-config.yaml`, new
#         bare or unjustified suppressions cannot be silently introduced.
extend-select = ["E302", "E303", "E305", "RUF100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short --cov=tsigma --cov-report=term-missing --cov-report=html"
markers = [
    "integration: requires a running PostgreSQL database (set TSIGMA_TEST_DB_URL)",
]
